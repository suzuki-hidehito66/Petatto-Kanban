name: Enforce test to main

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require PR from test branch only
        if: github.head_ref != 'test'
        run: |
          echo "::error::main へのマージは test ブランチからの PR のみ許可されています（現在: ${{ github.head_ref }}）"
          exit 1
      - name: Source branch OK
        if: github.head_ref == 'test'
        run: echo "OK merging test into main"
