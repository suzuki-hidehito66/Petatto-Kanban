name: Enforce test to main

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require PR from test
        if: github.head_ref != 'test'
        run: |
          echo "::error::main へのマージは test からの PR のみ許可されています（現在: ${{ github.head_ref }}）。dev_* は test で検証してから test → main とする。"
          exit 1
      - name: Source branch OK
        if: github.head_ref == 'test'
        run: echo "OK merging test into main"
