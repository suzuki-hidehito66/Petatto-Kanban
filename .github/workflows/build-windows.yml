name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "petatto-kanban.spec"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "petatto-kanban.spec"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check src tests

      - name: Build executable
        run: python -m PyInstaller petatto-kanban.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petatto-Kanban-windows
          path: dist/Petatto-Kanban.exe
