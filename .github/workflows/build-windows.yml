name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "petatto-kanban.spec"
      - "docs/spec/11-release-plan.md"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "petatto-kanban.spec"
      - "docs/spec/11-release-plan.md"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify release version sync
        run: python -m pytest tests/test_release_version.py

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check src tests

      - name: Build executable
        run: python -m PyInstaller petatto-kanban.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petatto-Kanban-windows-${{ github.sha }}
          path: dist/Petatto-Kanban.exe

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump app version in pyproject.toml, __init__.py, and docs/spec/11-release-plan.md before merging to main."
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Petatto-Kanban-windows-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Petatto-Kanban ${{ steps.version.outputs.tag }}
          files: Petatto-Kanban.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
